<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>At Your Pace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <div class="title">
        <h1>At your pace</h1>
        <p class="sub">The teacher moves only as you move.</p>
      </div>
      <div class="move-pick">
        <select id="move" aria-label="Move"></select>
        <label class="button quiet" for="videoFile">Learn from a video…</label>
        <input id="videoFile" type="file" accept="video/*" hidden />
      </div>
    </header>

    <p id="cue" class="cue"></p>

    <main class="stages">
      <section class="stage">
        <canvas id="teacher"></canvas>
        <span class="tag">Teacher</span>
        <span id="holdTag" class="tag hold" hidden>Hold</span>
      </section>
      <section class="stage">
        <canvas id="you"></canvas>
        <span class="tag">You</span>
        <div id="youEmpty" class="empty">
          <p>Stand back so your whole body is in view, facing the screen.</p>
          <button id="startCamera" class="button">Start camera</button>
          <button id="startSim" class="button quiet">Try with a simulated student</button>
          <p id="cameraError" class="error" hidden></p>
        </div>
      </section>
    </main>

    <section class="strip">
      <canvas id="timeline" aria-label="Progress through the move"></canvas>
      <div class="readout">
        <p id="status">Choose a move.</p>
        <p id="pace" class="pace"></p>
      </div>
    </section>

    <section class="controls">
      <button id="restart" class="button quiet">Restart</button>
      <label class="range">
        <span>Look ahead <output id="leadOut"></output></span>
        <input id="lead" type="range" min="0" max="1.5" step="0.05" value="0.5" />
      </label>
      <label class="range">
        <span>Forgiveness <output id="threshOut"></output></span>
        <input id="thresh" type="range" min="0.1" max="0.45" step="0.01" value="0.22" />
      </label>
      <label class="check"><input id="loop" type="checkbox" /> Repeat</label>
      <label class="check"><input id="ghost" type="checkbox" checked /> Show my outline on the teacher</label>
      <label class="check" id="facingWrap" hidden><input id="facingAway" type="checkbox" /> Teacher has their back to the camera</label>
      <div id="simControls" class="sim" hidden>
        <label class="range">
          <span>Student speed <output id="simSpeedOut"></output></span>
          <input id="simSpeed" type="range" min="0" max="2" step="0.05" value="0.4" />
        </label>
        <button id="simPause" class="button quiet">Pause student</button>
        <button id="useCamera" class="button quiet">Use camera instead</button>
      </div>
    </section>

    <div id="analyzing" class="overlay" hidden>
      <div class="panel">
        <p>Reading the teacher's movements…</p>
        <progress id="analyzeProgress" max="1" value="0"></progress>
        <button id="analyzeCancel" class="button quiet">Cancel</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
