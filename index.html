<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>At Your Pace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/primary/style.css" />
  </head>
  <body>
    <!-- Layers, back to front: camera, energy, guidance, then the chrome. -->
    <div class="layer camera" aria-hidden="true">
      <video id="cam" muted playsinline></video>
      <canvas id="backdrop" hidden></canvas>
    </div>
    <div class="layer grade" aria-hidden="true"></div>
    <!-- The qi-energy layer (src/energy/) draws here; it is screened over the camera. -->
    <canvas id="energy" class="layer energy" aria-hidden="true"></canvas>
    <!-- The hands' paths to trace, their beads and the learner's hand rings (src/primary/guidance.ts). -->
    <canvas id="guidance" class="layer" aria-hidden="true"></canvas>

    <div class="chrome">
      <div class="corner top-left">
        <select id="move" aria-label="Move"></select>
      </div>
      <div class="corner top-right">
        <div id="posture" role="group" aria-label="Posture">
          <button type="button" data-posture="standing" aria-pressed="true">Standing</button>
          <button type="button" data-posture="seated" aria-pressed="false">Seated</button>
        </div>
        <button id="again" type="button" hidden>Begin again</button>
        <button id="useCamera" type="button" hidden>Start camera</button>
      </div>
      <!-- Record the session's tracked landmarks (no images) to send to the developers; R does the same. -->
      <div class="corner bottom-left session">
        <button id="record" type="button" aria-pressed="false" aria-keyshortcuts="r" hidden>Record</button>
        <span id="replayNote" aria-live="polite"></span>
      </div>
      <div class="corner bottom-right">
        <!-- A few simple shapes that measure the learner and the camera, for the developers. -->
        <a class="debug-link" href="calibrate.html">calibrate</a>
        <a class="debug-link" href="debug.html">debug</a>
      </div>
    </div>
    <!-- Stays, faintly, while recording, even when the chrome has faded. -->
    <span id="recordDot" class="record-dot" title="Recording" hidden></span>

    <section id="intro" class="intro">
      <h1>At your pace</h1>
      <p>The guide moves only as you move.</p>
      <button id="startCamera" type="button">Start camera</button>
      <a class="quiet" href="?sim">Watch a simulated student instead</a>
      <p id="cameraError" class="error" hidden></p>
    </section>

    <!-- Tracking trouble (src/primary/tracking.ts), up top, apart from the move's line. -->
    <p id="hint" class="hint" aria-live="polite"></p>
    <p id="line" class="line" aria-live="polite"></p>
    <div class="progress" aria-hidden="true"><div id="progress"></div></div>

    <script type="module" src="/src/primary/main.ts"></script>
  </body>
</html>
