<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qi energy tuning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --ink: #d9d4e6;
        --dim: #8a84a0;
        --line: #2a2638;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #050409;
        color: var(--ink);
        font: 13px/1.4 'IBM Plex Sans', system-ui, sans-serif;
      }
      body {
        display: flex;
      }
      #stage {
        position: relative;
        flex: 1;
        min-width: 0;
        overflow: hidden;
      }
      #stage canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #energy {
        mix-blend-mode: screen;
      }
      #fps {
        position: absolute;
        left: 12px;
        top: 10px;
        font-variant-numeric: tabular-nums;
        color: var(--dim);
        pointer-events: none;
      }
      aside {
        width: 290px;
        flex: none;
        overflow-y: auto;
        padding: 14px 16px 24px;
        border-left: 1px solid var(--line);
        background: #0b0912;
      }
      body.bare aside,
      body.bare #fps {
        display: none;
      }
      h1 {
        font-size: 14px;
        font-weight: 500;
        margin: 0 0 12px;
      }
      h2 {
        font-size: 11px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--dim);
        margin: 18px 0 8px;
      }
      select,
      button {
        font: inherit;
        color: var(--ink);
        background: #16131f;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 4px 8px;
      }
      select {
        width: 100%;
      }
      .row {
        display: flex;
        gap: 6px;
        align-items: center;
        margin: 6px 0;
      }
      .row label {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      #palettes button[aria-pressed='true'] {
        border-color: var(--ink);
      }
      .slider {
        display: grid;
        grid-template-columns: 76px 1fr 38px;
        gap: 8px;
        align-items: center;
        margin: 3px 0;
      }
      .slider span:last-child {
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: var(--dim);
      }
      input[type='range'] {
        width: 100%;
      }
      input[type='range']:disabled {
        opacity: 0.55;
      }
      .hint {
        color: var(--dim);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main id="stage">
      <canvas id="body"></canvas>
      <canvas id="energy"></canvas>
      <div id="fps"></div>
    </main>
    <aside>
      <h1>Qi energy tuning</h1>
      <select id="move" aria-label="Move"></select>
      <div id="palettes" class="row" role="group" aria-label="Palette"></div>
      <div class="row"><label><input id="showBody" type="checkbox" checked /> Show the body</label></div>

      <h2>Drive</h2>
      <div class="row"><label><input id="auto" type="checkbox" checked /> Auto from the move</label></div>
      <div class="row">
        <label><input id="ramp" type="checkbox" checked /> Ramp level over 60 s</label>
        <button id="restart" type="button">Restart</button>
      </div>

      <h2>Qi frame</h2>
      <div id="sliders"></div>
      <p class="hint">
        H hides the panel. URL options: palette, move, any slider by its label (which turns its drive off), warm (seconds
        to run before showing), body=0, bare. For example ?palette=jade&amp;move=hug-tree&amp;level=0.5&amp;warm=20
      </p>
    </aside>
    <script type="module" src="/src/energy/harness.ts"></script>
  </body>
</html>
